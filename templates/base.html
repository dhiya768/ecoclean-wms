<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EcoClean | Smart Waste Management{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #0d1117; color: #e6edf3; padding-bottom: 50px; }

        /* Navbar */
        .navbar {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .brand { font-size: 22px; font-weight: bold; color: #3fb950; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: #c9d1d9; text-decoration: none; font-weight: 600; font-size: 15px; }
        .nav-links a:hover { color: #3fb950; }
        .counter-badge {
            background-color: #0d1117;
            border: 1px solid #30363d;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* Container & Solid Dark Banner (No Gradient) */
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        .hero {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin: 25px 0;
        }
        .hero h1 { font-size: 28px; color: #ffffff; margin-bottom: 8px; }
        .hero p { color: #8b949e; font-size: 15px; }

        /* BIG HIGHLIGHTED COMPLAINT ID BOX */
        .id-banner {
            background-color: #12261e;
            border: 2px solid #2ea043;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(46, 160, 67, 0.25);
        }
        .id-banner h3 { color: #3fb950; margin-bottom: 8px; font-size: 20px; }
        .id-code {
            display: inline-block;
            background-color: #0d1117;
            color: #58a6ff;
            font-size: 26px;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px dashed #58a6ff;
            letter-spacing: 2px;
            margin: 8px 0;
        }
        .copy-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
        .copy-btn:hover { background-color: #2ea043; }

        /* Two Column Grid */
        .grid { display: flex; gap: 25px; flex-wrap: wrap; }
        .col-left { flex: 1.4; min-width: 320px; }
        .col-right { flex: 1; min-width: 300px; }

        /* Cards */
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
        }
        .card-header-green { background-color: #198754; color: white; padding: 14px 20px; font-weight: bold; font-size: 18px; }
        .card-header-blue { background-color: #0d6efd; color: white; padding: 14px 20px; font-weight: bold; font-size: 18px; }
        .card-body { padding: 22px; }

        /* Form Inputs */
        .row-2 { display: flex; gap: 15px; }
        .row-2 > div { flex: 1; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #c9d1d9; }
        input[type="text"], input[type="tel"], input[type="date"], input[type="file"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #58a6ff; }

        /* Buttons */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit:hover { background-color: #2ea043; }

        .search-bar { display: flex; gap: 8px; margin-bottom: 18px; }
        .search-bar input { margin-bottom: 0; }
        .btn-search {
            padding: 10px 20px;
            background-color: #1f6feb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-search:hover { background-color: #388bfd; }

        /* Search Ticket Result */
        .ticket {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-left: 5px solid #1f6feb;
            border-radius: 8px;
            padding: 16px;
        }
        .ticket-top { display: flex; justify-content: space-between; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 12px; }
        .badge-status { background-color: #d29922; color: #000; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-cat { background-color: #238636; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
        .ticket p { margin-bottom: 8px; font-size: 14px; }
        .desc-box { background-color: #161b22; padding: 10px; border-radius: 6px; border: 1px solid #30363d; margin-top: 10px; font-size: 14px; }
        .complaint-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; margin-top: 10px; border: 1px solid #30363d; }
        .error-box { background-color: #3d1418; border: 1px solid #f85149; color: #ffa198; padding: 12px; border-radius: 8px; font-size: 14px; }
        .empty-state { text-align: center; color: #8b949e; padding: 30px 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/" class="brand">♻️ EcoClean WMS</a>
        
        <div class="nav-links">
            <a href="/">Complaints</a>
            <a href="/schedules">Collection Schedules</a>
            <a href="/admin">Admin Dashboard</a>
        </div>

        {% if total_complaints is defined %}
        <div class="counter-badge">Total Complaints: <b>{{ total_complaints }}</b></div>
        {% endif %}
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
